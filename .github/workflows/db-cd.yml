# Manual deploy to a remote profile (mise.<profile>.toml must exist).
# Mirrors `mise -E <profile> run deploy:plan|deploy:apply` from a laptop.
# Not triggered on push until real environments exist.
name: db-cd

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Profile (mise.<profile>.toml), also the GitHub environment name"
        required: true
        type: string
      mode:
        type: choice
        options: [plan, apply]
        default: plan

# One deploy at a time; never cancel a migration mid-flight.
concurrency:
  group: db-cd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ inputs.profile }} (${{ inputs.mode }})
    if: github.ref == 'refs/heads/db/schema'
    # Private DBs: set DB_RUNNER to a self-hosted runner label inside the network.
    runs-on: ${{ vars.DB_RUNNER || 'ubuntu-latest' }}
    environment: ${{ inputs.profile }}
    timeout-minutes: 60
    env:
      MISE_ENV: ${{ inputs.profile }}
      SECRETS_SOURCE: env
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5

      # Passwords come from this GitHub environment's secrets (*_PASSWORD);
      # topology comes from the committed mise.<profile>.toml.
      - name: Load secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          jq -r 'to_entries[] | select(.key | test("_PASSWORD$")) | "\(.key)<<__S__\n\(.value)\n__S__"' \
            <<< "$SECRETS_JSON" >> "$GITHUB_ENV"

      - name: Plan
        run: mise run deploy:plan
      - name: Apply
        if: inputs.mode == 'apply'
        run: mise run deploy:apply --yes
      # Keep the pre-deploy schema snapshot (BACKUP_BEFORE_MIGRATE); the runner is thrown away.
      - name: Upload snapshot
        if: always() && inputs.mode == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-${{ inputs.profile }}-${{ github.run_id }}
          path: snapshots/.backups/
          if-no-files-found: ignore
