# Same commands you run locally, on the `ci` profile (throwaway Docker).
name: db-ci

on:
  pull_request:
    branches: [db/schema]
  push:
    branches: [db/schema]

# Cancel superseded PR runs only.
concurrency:
  group: db-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MISE_ENV: ci

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: jdx/mise-action@v5
      - name: Lint, safety rules, immutability
        run: mise run check:all

  # The real schema in migrations/ applies from scratch, every tenant identical.
  schema:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      - run: mise run dev:start
      - run: mise run db:check
      - run: mise run db:diff
      - run: mise run tenant:list

  # The tooling itself, on fixture migrations.
  e2e:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v5
      # Every command against real Postgres: migrate, drift, tenants, guards, recovery, deploy.
      - name: End-to-end suite
        run: mise run test:e2e
      - if: failure()
        run: tail -200 "$HOME/.cache/sanketa-db-e2e/e2e.log" || true
