fabric:
  token:
    # Token time-to-live in seconds (15 minutes default)
    token-ttl-seconds: 900
    
    # HTTP header name for TCT token
    token-header-name: X-Tenant-Context-Token
    
    # Whether to require token for all requests
    require-token: true
    
    # Public paths that don't require token
    public-paths:
      - /health
      - /actuator/**
      - /api/v1/token/validate
    
    # Key ID for signing/verification
    key-id: default
    
    # HashiCorp Vault Configuration
    vault:
      key-id: default
      # Vault path prefix (default: "secret/data/fabric/token/keys")
      path-prefix: secret/data/fabric/token/keys
    
    # Key rotation policy (future-proofing)
    # Note: Key rotation functionality to be implemented
    key-rotation:
      # Enable automatic key rotation
      enabled: false
      
      # Rotation interval in days
      rotation-interval-days: 90
      
      # Number of previous keys to keep for verification during rotation grace period
      keep-previous-keys: 2
      
      # Grace period in days after rotation before old keys are invalidated
      grace-period-days: 7
      
      # Rotation strategy: "scheduled" (time-based) or "manual" (on-demand)
      strategy: scheduled
      
      # Notification settings for rotation events (future)
      notifications:
        enabled: false
        # channels: [email, webhook, log]

  # HashiCorp Vault Configuration
  vault:
    enabled: true
    
    address: http://localhost:8200
    
    namespace: ""
    
    # Authentication configuration
    auth:
      # Authentication method: token or approle
      method: token
      
      # Token authentication (for development)
      token:
        token: ""  # Leave empty to use VAULT_TOKEN env var
      
      # AppRole authentication (recommended for production)
      approle:
        role-id: ""      # Leave empty to use VAULT_ROLE_ID env var
        secret-id: ""    # Leave empty to use VAULT_SECRET_ID env var
        mount-path: approle
    
    # Connection configuration (optional - Spring Vault has defaults)
    connection:
      timeout: PT10S      # Connection timeout (default: 10 seconds)
      read-timeout: PT30S  # Read timeout (default: 30 seconds)
    
    # TLS/SSL configuration (optional - only needed for HTTPS)
    tls:
      verify: true         # Enable TLS verification (set false for dev with self-signed certs)

  # Redis Caching Configuration with separate caches for:
  # - Tenant data
  # - User-tenant mappings
  # - Global/shared data
  redis:
    # Enable Redis caching
    enabled: true
    
    # Key prefix for namespace isolation (optional)
    key-prefix: 
    
    # Standalone configuration
    standalone:
      host: localhost
      port: 6379
      password: ""  # Leave empty if no password
      database: 0
    
    # Connection pool configuration
    pool:
      max-active: 20
      max-idle: 10
      min-idle: 5
      max-wait: PT2S  # 2 seconds
      test-on-borrow: true
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs: PT30S  # 30 seconds
    
    # Timeout configuration
    timeout:
      connect: PT10S  # 10 seconds
      command: PT5S    # 5 seconds
    
    # Tenant cache configuration
    tenant:
      enabled: true
      default-ttl: PT30M  # 30 minutes
      key-prefix: tenant
      enable-stats: true
    
    # User-tenant mapping cache configuration
    user-tenant:
      enabled: true
      default-ttl: PT15M  # 15 minutes (shorter TTL for user data)
      key-prefix: user-tenant
      enable-stats: true
    
    # Global cache configuration
    global:
      enabled: true
      default-ttl: PT1H  # 1 hour (longer TTL for global data)
      key-prefix: global
      enable-stats: true
    
    # Health check configuration
    health:
      enabled: true
      interval: PT30S  # Check every 30 seconds
      timeout: PT5S    # Health check timeout
      failure-threshold: 3  # Mark unhealthy after 3 consecutive failures
    
    # Exception handling configuration
    exception-handling:
      # Fail gracefully (return null/do nothing) instead of throwing exceptions
      # When true: cache failures won't break the application (recommended for production)
      # When false: cache failures will throw CacheException (caught by GlobalExceptionHandler)
      fail-gracefully: true
      
      # Throw exceptions for critical operations even if fail-gracefully is true
      # Operations like: put, delete, clear
      throw-on-critical-operations: false
      
      # Log exceptions even when failing gracefully
      log-exceptions: true

spring:
  application:
    name: fabric

server:
  port: 8080

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized  # Show details when authorized, or use "always" for development
      show-components: always
  health:
    redis:
      enabled: true  # Enable Redis health indicator

logging:
  level:
    root: INFO
    # Application-specific logging
    com.sanketa.fabric: INFO
    com.sanketa.fabric.token: DEBUG
    # Framework logging (reduce noise)
    org.springframework: WARN
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate: WARN
    org.apache: WARN

