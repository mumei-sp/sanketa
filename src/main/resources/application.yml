fabric:
  token:
    # Token time-to-live in seconds (15 minutes default)
    token-ttl-seconds: 900
    
    # HTTP header name for TCT token
    token-header-name: X-Tenant-Context-Token
    
    # Whether to require token for all requests
    require-token: true
    
    # Public paths that don't require token
    public-paths:
      - /health
      - /actuator/**
      - /api/v1/token/validate
    
    # HashiCorp Vault Configuration
    vault:
      # Vault path prefix (default: "secret/data/fabric/token/keys")
      path-prefix: secret/data/fabric/token/keys
    
    # Key rotation policy
    key-rotation:
      # Enable automatic key rotation and cleanup
      enabled: false
      
      # Rotation interval in days
      rotation-interval-days: 30
      
      # Number of previous keys to keep for verification during rotation
      keep-previous-keys: 2
      
      # Cleanup period in days - keys older than this are deleted from both Vault and in-memory
      # Old keys are kept for this period to allow verification of tokens signed with them
      cleanup-period-days: 90
      
      # This single cron job:
      # 1. Checks if rotation is needed (every 30 days) and rotates if needed
      # 2. Cleans up old keys from both Vault and in-memory (after cleanup-period-days)
      rotation-cron: "0 0 2 * * ?"
      
      # Rotation strategy: "scheduled" (time-based) or "manual" (on-demand)
      strategy: scheduled
      
      # Notification settings for rotation events (future)
      notifications:
        enabled: false
        # channels: [email, webhook, log]

  # HashiCorp Vault Configuration
  vault:
    enabled: true
    
    address: http://localhost:8200
    
    # Transit Engine Configuration
    # When enabled, Transit Engine manages key lifecycle (generation, rotation)
    # while keys are stored in KV for high-performance in-memory signing
    transit:
      # Enable Transit Engine for key management
      enabled: false
      
      # Transit Engine mount path (default: transit)
      mount-path: transit
      
      # Key name in Transit Engine
      key-name: fabric-token-key
      
      # Key type (note: Transit Engine doesn't natively support Ed25519,
      # so we use a hybrid approach: generate Ed25519 locally, manage via Transit)
      key-type: ed25519
      
      # Export keys to KV for fast access (recommended: true)
      export-to-kv: true
      
      # Automatic key rotation configuration
      rotation:
        # Enable automatic key rotation
        enabled: false
        
        # Rotation interval in days
        interval-days: 30
    
    # Authentication configuration
    auth:
      # Authentication method: token or approle
      method: token
      
      # Token authentication (for development)
      token:
        token: ""  # Leave empty to use VAULT_TOKEN env var
      
      # AppRole authentication (recommended for production)
      approle:
        role-id: ""      # Leave empty to use VAULT_ROLE_ID env var
        secret-id: ""    # Leave empty to use VAULT_SECRET_ID env var
        mount-path: approle
    
    # Connection configuration (optional - Spring Vault has defaults)
    connection:
      timeout: PT10S      # Connection timeout (default: 10 seconds)
      read-timeout: PT30S  # Read timeout (default: 30 seconds)
    
    # TLS/SSL configuration (optional - only needed for HTTPS)
    tls:
      verify: true         # Enable TLS verification (set false for dev with self-signed certs)

  # Redis Caching Configuration with separate caches for:
  # - Tenant data
  # - User-tenant mappings
  # - Global/shared data
  redis:
    # Enable Redis caching
    enabled: true
    
    # Key prefix for namespace isolation (optional)
    key-prefix: 
    
    # Standalone configuration
    standalone:
      host: localhost
      port: 6379
      password: ""  # Leave empty if no password
      database: 0
    
    # Connection pool configuration (optimized for virtual threads)
    pool:
      max-active: 50
      max-idle: 20
      min-idle: 10
      max-wait: PT2S  # 2 seconds
      test-on-borrow: true
      test-on-return: false
      test-while-idle: true
      time-between-eviction-runs: PT30S  # 30 seconds
    
    # Timeout configuration
    timeout:
      connect: PT10S  # 10 seconds
      command: PT5S    # 5 seconds
    
    # Tenant cache configuration
    tenant:
      enabled: true
      default-ttl: PT30M  # 30 minutes
      key-prefix: tenant
      enable-stats: true
    
    # User-tenant mapping cache configuration
    user-tenant:
      enabled: true
      default-ttl: PT15M  # 15 minutes (shorter TTL for user data)
      key-prefix: user-tenant
      enable-stats: true
    
    # Global cache configuration
    global:
      enabled: true
      default-ttl: PT1H  # 1 hour (longer TTL for global data)
      key-prefix: global
      enable-stats: true
    
    # Health check configuration
    health:
      enabled: true
      interval: PT30S  # Check every 30 seconds
      timeout: PT5S    # Health check timeout
      failure-threshold: 3  # Mark unhealthy after 3 consecutive failures
    
    # Exception handling configuration
    exception-handling:
      # Fail gracefully (return null/do nothing) instead of throwing exceptions
      # When true: cache failures won't break the application (recommended for production)
      # When false: cache failures will throw CacheException (caught by GlobalExceptionHandler)
      fail-gracefully: true
      
      # Throw exceptions for critical operations even if fail-gracefully is true
      # Operations like: put, delete, clear
      throw-on-critical-operations: false
      
      # Log exceptions even when failing gracefully
      log-exceptions: true

  # Multi-Tenant Database Routing Configuration
  database:
    # Enable tenant database routing
    enabled: true
    
    # Connection pool configuration (optimized for virtual threads)
    pool:
      max-size: 50              # Maximum pool size per database instance
      min-idle: 10               # Minimum idle connections per pool
      max-idle: 20              # Maximum idle connections per pool
      connection-timeout: PT30S # Connection timeout (time to wait for a connection from pool)
      idle-timeout: PT10M       # Idle timeout (time before idle connections are removed)
      max-lifetime: PT30M       # Maximum lifetime of a connection in the pool
      test-on-borrow: true      # Test connections on borrow
      test-on-return: false     # Test connections on return
      test-while-idle: true     # Test connections while idle
      time-between-eviction-runs: PT30S  # Time between eviction runs for idle connections
      validation-query: ""      # Connection validation query (empty = use default for DB type)
    
    # Timeout configuration
    timeout:
      connect: PT10S    # Connection timeout (time to establish connection)
      socket: PT30S     # Socket timeout (time to wait for data)
      query: PT60S      # Query timeout (time to wait for query execution)
    
    # Health check configuration
    health:
      enabled: true             # Enable health checks
      interval: PT30S           # Health check interval
      timeout: PT5S              # Health check timeout
      failure-threshold: 3      # Number of consecutive failures before marking as unhealthy
    
    # Schema switching configuration
    schema:
      enabled: true             # Enable schema switching (for schema-based multi-tenancy)
      validate-schema: true     # Validate schema exists before switching
      method: hibernate         # Schema switching method: "hibernate" (via hibernate.default_schema) or "sql" (via SET SCHEMA)

  # Tenant warm-up configuration
  tenant:
    warmup:
      # Enable warm-up of critical tenants on application startup
      enabled: false

      # List of critical tenant identifiers (IDs or codes) to warm on startup
      # Example:
      # critical-tenants:
      #   - 1001
      #   - 1002
      critical-tenants: []

spring:
  application:
    name: fabric
  # Virtual Threads Configuration
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  tomcat:
    threads:
      max: 200        # Platform threads (carriers for virtual threads)
      min-spare: 10   # Minimum platform threads

# Spring Boot Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus  # Added metrics and prometheus
  metrics:
    export:
      prometheus:
        enabled: true  # Enable Prometheus metrics for monitoring
  endpoint:
    health:
      show-details: when-authorized  # Show details when authorized, or use "always" for development
      show-components: always
  health:
    redis:
      enabled: true  # Enable Redis health indicator
    database:
      enabled: true  # Enable tenant database health indicator

logging:
  level:
    root: INFO
    # Application-specific logging
    com.sanketa.fabric: INFO
    com.sanketa.fabric.token: DEBUG
    # Framework logging (reduce noise)
    org.springframework: WARN
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate: WARN
    org.apache: WARN

